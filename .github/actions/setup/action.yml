name: Set up the rovo toolchain
description: >-
  uv at its pin, just from uv's tool directory, the environment uv.lock pins
  (Python, every tool and, unless the job sets UV_NO_GROUP, the tooling
  group's checkers), and prek's hook environments with lychee warmed. Runs
  after the checkout.

inputs:
  python-version:
    description: >-
      The interpreter uv runs every recipe on, exported as UV_PYTHON. 3.14 runs
      the full gate; 3.13 runs the Python gates without the tooling group.
    required: false
    default: '3.14'

runs:
  using: composite
  steps:
    # The one uv pin in YAML: nothing else can install uv. The cache is keyed
    # on uv.lock, so a relock is a new key.
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: '0.13.6'
        enable-cache: true
        cache-dependency-glob: uv.lock
    # Through the environment, not `${{ }}` inside the shell line. UV_PYTHON
    # outranks .python-version, so the 3.13 job really runs 3.13.
    - run: echo "UV_PYTHON=$PYTHON_VERSION" >> "$GITHUB_ENV"
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
    # just cannot come from the project environment: the Justfile is what
    # creates that.
    - run: |
        uv tool install rust-just==1.59.0
        uv tool dir --bin >> "$GITHUB_PATH"
      shell: bash
    # Exactly what uv.lock says; the lock is never rewritten. A job's env
    # reaches this step, so UV_NO_GROUP=tooling leaves B out here.
    - run: just sync
      shell: bash
    # prek's own cache directory, outside the workspace, so check-clean's
    # snapshot never sees it: the hook clones, their toolchains and the
    # ripsecrets build, which a cold run would otherwise fetch. Keyed on both
    # hook configurations and on uv.lock, which pins prek, and on the
    # python-version input: a python hook environment records the absolute
    # path of the interpreter it was built with, which lives outside this
    # cache, so the 3.13 floor and the 3.14 legs must not share an entry (an
    # exact hit is never re-saved). Restored here and
    # saved explicitly once the hooks are proven warm (below), not by the
    # action's post step, which saves only when the whole job succeeds: a
    # later red `just check` would otherwise leave every run cold.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: prek-cache
      with:
        path: ~/.cache/prek
        key: ${{ runner.os }}-${{ runner.arch }}-prek-py${{ inputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml', '.pre-commit-fix.yaml', 'uv.lock') }}
    # The prepare and the lychee warm are the point; the shim it writes into
    # the runner's .git is harmless. A restored cache is not enough: on a
    # cold one, `just check` would fetch every hook environment and lychee.
    # The recipe fails unless lychee's pinned binary is present (warm-lychee,
    # which retries the download), so no later step reaches the network.
    # The run's own token, on this step only: lychee's cargo-binstall asks
    # GitHub's API for the release, and without a token it shares the
    # runner's per-IP limit of 60 requests an hour, whose exhaustion ends in
    # a failed `cargo install` fallback (exit 100) on macOS. The workflow's
    # `contents: read` bounds what the token can do. The recipe unsets it for
    # the hook prepares, which compile, so only the lychee warm sees it.
    - run: just install-hooks
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
    # prek prints nothing when it builds a hook environment, so name the
    # ripsecrets binary it built with the runner's Rust, and that compiler.
    - run: |
        found=$(find ~/.cache/prek/hooks -path '*/bin/ripsecrets' -perm -u+x -print -quit)
        test -n "$found" || { echo 'the ripsecrets hook environment was not built' >&2; exit 1; }
        echo "ripsecrets built: $found"
        grep -o -E '"(language_version|toolchain)": *"[^"]*"' "${found%/bin/ripsecrets}/.prek-hook.json"
      shell: bash
    # The hooks and lychee are warm (install-hooks and the step above would
    # have failed otherwise), so save them now, whatever the gate does next.
    - if: steps.prek-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/prek
        key: ${{ runner.os }}-${{ runner.arch }}-prek-py${{ inputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml', '.pre-commit-fix.yaml', 'uv.lock') }}
