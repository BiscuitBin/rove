# The only typos configuration. pyproject.toml carries no [tool.typos]: typos
# stops at the first configuration file it finds, and finds this one.

[files]
# The lockfile carries hashes and names that look like typos; target/ holds
# build output and ai_tmp/ scratch.
extend-exclude = [
  "target/",
  "ai_tmp/",
  "uv.lock",
]

[default.extend-words]
# "mis-" as a hyphenated prefix (mis-wired, mis-asserting) reads as the
# fragment "mis", which the checker's dictionary mistakes for "miss"/"mist".
mis = "mis"
# The tickets name "als" as the word this file once listed and now does not
# need; the checker's dictionary rewrites it to "also".
als = "als"
# ruff's rule code CPY001 (flake8-copyright), which ruff.toml ignores while the
# licence is undecided; the checker's dictionary rewrites "CPY" to "COPY".
cpy = "cpy"
