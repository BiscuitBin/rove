[pytest]
# Summarise every non-pass; reject unknown config keys and unregistered markers.
# Deselect the real-browser tests everywhere but `just e2e-browser`, whose own
# `-m browser` comes later on the command line and wins (pytest keeps the last -m).
addopts = -ra --strict-config --strict-markers -m "not browser"
# Every marker the suite uses; --strict-markers rejects any other.
markers =
    browser: needs playwright and its browser; run with just e2e-browser
testpaths = tests
# An xfail that passes is a failure: the expectation it records is stale.
xfail_strict = true
# A warning is a failure, so a deprecation surfaces before it breaks.
filterwarnings =
    error
