[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "rovo"
# Static: hatchling writes it into the metadata, and rovo.__version__ reads it back
# through importlib.metadata, so this line is the only copy (decision 0002).
version = "0.0.0"
description = "rovo: a Python API and the rovo command."
readme = "README.md"
requires-python = ">=3.13"
# No license and no license-files: the licence is undecided (decision 0006).
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  # PyPI refuses any upload carrying this classifier. It stays until the release
  # ticket, which needs the licence decision first (decision 0006).
  "Private :: Do Not Upload",
]
dependencies = [
  # The command-line framework. Imported by rovo.cli alone, never by `import rovo`
  # (decision 0003). A compatible range: uv.lock is the pin (decision 0005).
  "typer>=0.27.3,<0.28",
  # The HTTP client the crawl fetches pages with. urllib has no connection pooling with
  # limits, no timeout per phase and no HTTP/2. BSD-3-Clause; released by Encode
  # (Tom Christie), the locked 0.28.1 uploaded 2024-12-06. At 0.x: the next minor bounds it.
  "httpx>=0.28.1,<0.29",
  # The HTML tree that extraction and link rewriting walk. The standard library has
  # html.parser, a tokenizer, but no navigable tree. MIT; released by Leonard Richardson,
  # the locked 4.15.0 uploaded 2026-06-07.
  "beautifulsoup4>=4.15.0,<5",
  # The parser beautifulsoup4 is driven with: fast and the one the tests run, where
  # html.parser is slow and lenient. BSD-3-Clause (the wheel bundles libxml2 and libxslt,
  # MIT); released by the lxml dev team, the locked 6.1.3 uploaded 2026-09-02.
  "lxml>=6.1.3,<7",
  # HTML to Markdown, the conversion's core; the standard library has no converter.
  # MIT (by its classifier; the metadata has no License field); released by Matthew
  # Tretter, the locked 1.2.3 uploaded 2026-06-30.
  "markdownify>=1.2.3,<2",
  # robots.txt parsing and matching for the crawl: RFC 9309 longest match, Allow
  # winning ties, * and $ wildcards, and a decimal Crawl-delay. Python 3.13's
  # urllib.robotparser answers by the first matching rule and drops a fractional
  # Crawl-delay. Pure Python, no dependencies. BSD-3-Clause; released by the Scrapy
  # project (author Anubhav Patel), the locked 0.7.0 uploaded 2026-09-21. At 0.x: the
  # next minor bounds it. Imported by rovo._crawl alone.
  "protego>=0.7.0,<0.8",
]

[project.optional-dependencies]
browser = [
  # The browser tier: renders pages that need JavaScript; the standard library has no
  # JavaScript engine. The extra installs the Python package only, never a browser
  # (`playwright install` fetches those). Apache-2.0; released by Microsoft, the locked
  # 1.64.1 uploaded 2026-10-22. Imported by nothing yet.
  "playwright>=1.64.1,<2",
]

[project.scripts]
rovo = "rovo.cli:app"

[project.urls]
Repository = "https://github.com/BiscuitBin/rove"

[dependency-groups]
# Exact pins: the gate's verdict depends on each tool's version (decision 0005).
dev = [
  "coverage==7.17.0",
  "mypy==2.4.1",
  "prek==0.5.9",
  "pytest==9.2.0",
  "ruff==0.17.3",
]
# B's checkers. B requires Python 3.14, so this group carries its own floor and
# the 3.13 CI leg runs without it (CONVENTIONS.md §1 fact 1).
tooling = ["biscuit-games-tooling"]

[tool.uv]
default-groups = ["dev", "tooling"]

[tool.uv.dependency-groups]
tooling = { requires-python = ">=3.14" }

[tool.uv.sources]
biscuit-games-tooling = { git = "https://github.com/steven-cutting/biscuit_games_tooling", tag = "v0.3.0" }

[tool.hatch.build.targets.wheel]
packages = ["src/rovo"]

[tool.hatch.build.targets.sdist]
# Without this, hatchling packs every file Git does not ignore: tickets, docs, CI.
only-include = ["src/rovo", "tests", "README.md", "CHANGELOG.md"]

# typos is configured in _typos.toml, ruff in ruff.toml, mypy in mypy.ini, pytest in
# pytest.ini and coverage in .coveragerc: T02 owns those, and this file is frozen.

[tool.biscuit-games-tooling]
# What `just check` runs, in order, before check-clean (CONVENTIONS.md §4).
recipes = [
  "lock-check",
  "lint",
  "py-lint",
  "py-typecheck",
  "coverage",
  "wheel-smoke",
  "check-docs",
  "check-agents",
  "check-specs",
  "analyse-specs",
]
predicates = {}
