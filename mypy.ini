[mypy]
# Require complete annotations and reject implicit Any at the Python boundary.
strict = True
# Check every Python source root: the package, its tests and the wheel smoke.
files = src, tests, scripts
# Recursive discovery skips intentional failures; explicit control paths still run.
exclude = tests/fixtures/py-lint-violation
# Match the package's minimum interpreter, rather than the tooling Python.
python_version = 3.13
# Reject stale suppressions, including those introduced after strict mode changes.
warn_unused_ignores = True
# Report stale module configuration rather than silently accepting it.
warn_unused_configs = True
# Explicitly retain normal traversal: silent or skip would leave modules unchecked.
follow_imports = normal
# Report code mypy proves can never run: a dead branch is an untested branch.
warn_unreachable = True
# Already implied by strict; stated, as W does, so a strict change cannot drop it.
warn_redundant_casts = True
